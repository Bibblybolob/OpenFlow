name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci

      # tauri-build validates the externalBin entry whenever the crate
      # compiles, even before the engine binary exists — stage a placeholder
      # on fresh checkouts so fmt/clippy/tests can run.
      - name: Stage cleanup-engine placeholder
        run: npm run copy-engine

      - name: Frontend typecheck & build
        run: npm run build

      - name: Rust fmt & clippy
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --check
          cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            triple: aarch64-apple-darwin
            cargoArgs: "--target aarch64-apple-darwin"
            tauriArgs: "--target aarch64-apple-darwin"
          - platform: macos-latest
            triple: x86_64-apple-darwin
            cargoArgs: "--target x86_64-apple-darwin"
            tauriArgs: "--target x86_64-apple-darwin"
          - platform: windows-latest
            triple: x86_64-pc-windows-msvc
            # NSIS only: WiX light.exe fails silently on current runners.
            # cargo must NOT receive bundler flags (--bundles) — hence the
            # separate tauriArgs below.
            cargoArgs: ""
            tauriArgs: "--bundles nsis"
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci

      # tauri-build validates the externalBin entry whenever the crate
      # compiles, so stage the sidecar before building. Cross-compile legs
      # (--target) output under target/<triple>/release — pass the triple.
      - name: Stage cleanup-engine placeholder
        run: node scripts/copy-engine.mjs ${{ matrix.triple }}

      - name: Build cleanup-engine helper
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --features engine ${{ matrix.cargoArgs }}

      - name: Stage real cleanup-engine for bundling
        run: node scripts/copy-engine.mjs ${{ matrix.triple }}

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signature key: stored as repo secrets.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "OpenFlow v__VERSION__"
          releaseBody: "See the assets below to download and install OpenFlow."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.tauriArgs }}

  # Rolling channel: every push to main that passes checks rebuilds all
  # platforms at a strictly-increasing dev version (e.g. 0.3.2-dev.142) and
  # republishes the single 'dev' release. Installed apps poll that release's
  # latest.json, so every merge shows up in-app as an "Update now" — no
  # tagging ceremony. Tagged v* releases remain stable snapshots.
  dev-build:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            triple: aarch64-apple-darwin
            cargoArgs: "--target aarch64-apple-darwin"
            tauriArgs: "--target aarch64-apple-darwin"
          - platform: macos-latest
            triple: x86_64-apple-darwin
            cargoArgs: "--target x86_64-apple-darwin"
            tauriArgs: "--target x86_64-apple-darwin"
          - platform: windows-latest
            triple: x86_64-pc-windows-msvc
            cargoArgs: ""
            tauriArgs: "--bundles nsis"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ contains(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend deps
        run: npm ci

      # Same version on every leg of one run (run_number is shared), strictly
      # greater than the previous run's stamp — the updater compares semver,
      # so each push must out-version the last.
      - name: Stamp rolling dev version
        shell: bash
        env:
          BASE_VERSION: ${{ vars.DEV_BASE_VERSION || '0.3.1' }}
        run: |
          VER="${BASE_VERSION%.*}.$((${BASE_VERSION##*.} + 1))-dev.${GITHUB_RUN_NUMBER}"
          echo "DEV_VERSION=$VER" >> "$GITHUB_ENV"
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "stamp: $VER"
          # GITHUB_ENV only applies to LATER steps — export for this shell.
          export DEV_VERSION="$VER"
          node -e "
            const fs=require('fs'); const v=process.env.DEV_VERSION;
            if (!/^\\d+\\.\\d+\\.\\d+-dev\\.\\d+$/.test(v)) throw new Error('bad stamp: '+v);
            for (const f of ['package.json','src-tauri/tauri.conf.json']) {
              const j=JSON.parse(fs.readFileSync(f,'utf8')); j.version=v;
              fs.writeFileSync(f, JSON.stringify(j,null,2)+'\n');
            }
            let c=fs.readFileSync('src-tauri/Cargo.toml','utf8');
            c=c.replace(/^version = \".*\"/m, 'version = \"'+v+'\"');
            fs.writeFileSync('src-tauri/Cargo.toml',c);
          "
          # Fail loudly rather than shipping an 'undefined' stamp.
          grep -q "version = \"$VER\"" src-tauri/Cargo.toml
          [ "$(node -p "require('./package.json').version")" = "$VER" ]

      # tauri-build validates the externalBin entry whenever the crate
      # compiles, so stage the sidecar before building.
      - name: Stage cleanup-engine placeholder
        run: node scripts/copy-engine.mjs ${{ matrix.triple }}

      - name: Build cleanup-engine helper
        run: cargo build --release --manifest-path src-tauri/Cargo.toml --features engine ${{ matrix.cargoArgs }}

      - name: Stage real cleanup-engine for bundling
        run: node scripts/copy-engine.mjs ${{ matrix.triple }}

      # Bundle WITHOUT publishing; artifacts carry everything to the
      # publisher job, which owns the rolling 'dev' release exclusively.
      - name: Build bundles
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.tauriArgs }}

      - name: Collect bundle outputs
        shell: bash
        run: |
          # Cross-compile legs bundle under target/<triple>/release; host
          # legs under target/release. nullglob + [ -d ] guards keep find
          # from exiting non-zero on paths that don't exist on this leg.
          shopt -s nullglob
          mkdir -p dist-dev
          for d in src-tauri/target/*/release/bundle src-tauri/target/release/bundle; do
            [ -d "$d" ] || continue
            find "$d" \
              \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.app.tar.gz.sig" \
                 -o -name "*-setup.exe" -o -name "*.nsis.zip" -o -name "*.nsis.zip.sig" \
                 -o -name "latest.json" \) \
              -exec cp {} dist-dev/ \;
          done
          # Both macOS legs emit identically-named updater files; prefix with
          # the triple so they can't clobber each other in the merged upload.
          for f in dist-dev/FlowClone.app.tar.gz dist-dev/FlowClone.app.tar.gz.sig; do
            [ -f "$f" ] || continue
            mv "$f" "dist-dev/${{ matrix.triple }}.${f##*/}"
          done
          ls -la dist-dev/
          [ -n "$(ls -A dist-dev)" ]

      - uses: actions/upload-artifact@v4
        with:
          name: dev-${{ matrix.triple }}
          path: dist-dev/*
          if-no-files-found: error

  # Single writer for the rolling 'dev' release: deletes previous assets,
  # uploads this run's full set, then merges the per-platform updater
  # manifests into one latest.json covering every platform.
  dev-publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [check, dev-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dev-*
          merge-multiple: true
          path: dist-dev

      - name: Show collected assets
        run: ls -la dist-dev/

      - uses: actions/checkout@v4

      - name: Ensure rolling dev release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view dev >/dev/null 2>&1 || \
            gh release create dev --title "Latest main build" --prerelease \
              --notes "Rolling build of main. Installed apps offer it via Update now."

      # Asset names embed the stamped version, so old ones would pile up on
      # the rolling release — clear them before uploading this run's set.
      - name: Clear previous dev assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api repos/${{ github.repository }}/releases/tags/dev --jq '.assets[].id' |
            xargs -r -n1 -I{} gh api -X DELETE repos/${{ github.repository }}/releases/assets/{}

      # Build latest.json from the .sig files: each sig names its artifact
      # and carries the minisign signature; the download URL is the fixed
      # per-release asset path the updater can fetch.
      - name: Generate updater manifest
        run: |
          node -e "
            const fs=require('fs'), path=require('path');
            const dir='dist-dev';
            const version=process.env.DEV_VERSION;
            const base='https://github.com/${{ github.repository }}/releases/download/dev/';
            const platforms={};
            const map={
              'aarch64-apple-darwin.FlowClone.app.tar.gz':['darwin-aarch64','aarch64-apple-darwin.FlowClone.app.tar.gz'],
              'x86_64-apple-darwin.FlowClone.app.tar.gz':['darwin-x86_64','x86_64-apple-darwin.FlowClone.app.tar.gz'],
              'FlowClone_'+version+'_x64-setup.exe':['windows-x86_64','FlowClone_'+version+'_x64-setup.exe']
            };
            for(const f of fs.readdirSync(dir).filter(f=>f.endsWith('.sig'))){
              let entry=null;
              for(const [k,[plat,art]] of Object.entries(map)){
                if(f===art+'.sig') entry=[plat,art];
              }
              if(!entry){ console.log('skip (no updater target): '+f); continue; }
              const [plat,art]=entry;
              platforms[plat]={signature:fs.readFileSync(path.join(dir,f),'utf8').trim(), url:base+art};
            }
            const manifest={version, notes:'Rolling build of main ('+(process.env.GITHUB_SHA||'').slice(0,7)+')', pub_date:new Date().toISOString(), platforms};
            fs.writeFileSync(path.join(dir,'latest.json'), JSON.stringify(manifest,null,2));
            console.log(JSON.stringify(manifest,null,2));
            if(Object.keys(platforms).length<3) throw new Error('expected 3 platform entries');
          "
        env:
          DEV_VERSION: ${{ needs.dev-build.outputs.version }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Upload fresh asset set
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload dev dist-dev/* --clobber

      - name: Point release at this run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEV_VERSION: ${{ needs.dev-build.outputs.version }}
        run: |
          gh release edit dev --title "Latest main build ($DEV_VERSION)" \
            --notes "Rolling build of main @ ${{ github.sha }}.

          Version \`$DEV_VERSION\` · installed apps offer this automatically via Update now."
