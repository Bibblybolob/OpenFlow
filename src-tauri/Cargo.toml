[package]
name = "flowclone"
version = "0.3.1"
description = "Cross-platform voice dictation app"
authors = ["Jonathan Tran"]
edition = "2021"
# Two bins (app + cleanup-engine sidecar); tell tauri's bundler which is the app.
default-run = "flowclone"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "cleanup-engine"
path = "src/bin/cleanup-engine.rs"
required-features = ["engine"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "flowclone_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"
device_query = "2"
cpal = "0.15"
hound = "3.5"
arboard = "3"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart", "rustls-tls"] }
whisper-rs = "0.14"
nnnoiseless = "0.5"
# Cleanup-engine-only deps. Kept out of the main binary: llama.cpp vendors
# its own ggml, and linking both copies into one image (whisper.cpp has the
# other) breaks C++ static initialization — the app exited silently before
# main(). The cleanup-engine bin enables this feature.
llama-cpp-2 = { version = "0.1", optional = true }
encoding_rs = { version = "0.8", optional = true }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"], optional = true }
tracing = { version = "0.1.44", optional = true }
sherpa-onnx = { version = "1.13.6", optional = true }
bzip2 = { version = "0.4", optional = true }
tar = { version = "0.4", optional = true }
[target.'cfg(target_os = "macos")'.dependencies]
embed_plist = "1"
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }

[features]
engine = ["dep:llama-cpp-2", "dep:encoding_rs", "dep:tracing-subscriber", "dep:tracing"]
parakeet = ["dep:sherpa-onnx", "dep:bzip2", "dep:tar"]

[profile.release]
codegen-units = 1
# thin, not fat: fat LTO broke with rustc 1.98.0 ("failed to load bitcode of
# module" + duplicate _EMBED_INFO_PLIST from embed_plist) on every full link;
# thin produces a working binary of near-identical size/speed.
lto = "thin"
opt-level = "s"
strip = true
